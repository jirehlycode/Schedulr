# Fly.io config. Set your own app name with: fly launch --no-deploy --copy-config --name <your-app>
app = "schedulr"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/schedulr.db"
  # Flip to "false" after you've created your own host account.
  ALLOW_SIGNUP = "true"

[mounts]
  source = "schedulr_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite lives on one volume, so run exactly one always-on machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
